services:
  project-a:
    build: ../service-template
    expose:
      - "8000"

  project-b:
    build: ../service-template
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - project-a
      - project-b